name: Release

# Publishes to npm when a GitHub Release is published.
#
# Authentication is npm trusted publishing: GitHub's OIDC token proves the
# package is built by this workflow in this repository, so no npm token is
# stored anywhere and every version carries a provenance attestation.
#
# One-time setup on npmjs.com (package settings -> Trusted publisher):
#   organisation MoleCare, repository rn-health-data, workflow release.yml,
#   environment npm.
# Trusted publishing needs a public repository and GitHub-hosted runners.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: tag matches the version, tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npx jest --ci

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts
      - run: npm publish --access public
